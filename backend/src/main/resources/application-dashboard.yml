# Dashboard run profile (Phase 9). Activate with: --spring.profiles.active=dashboard
# Turns the otherwise-headless app into a local, loopback-only web server.
spring:
  main:
    web-application-type: servlet
  web:
    resources:
      add-mappings: false
  thymeleaf:
    # Dashboard templates live under templates/dashboard/; email templates stay at the root.
    cache: false

server:
  address: 127.0.0.1   # loopback only — never exposed publicly (FR-41)
  port: 8080

jobwatch:
  dashboard:
    enabled: true
    serve-spa: ${JOBWATCH_SERVE_SPA:false}
  cors:
    allowed-origins: ${JOBWATCH_CORS_ALLOWED_ORIGINS:https://app-job-frontend-nine.vercel.app,http://localhost:5173}
    allowed-origin-patterns: ${JOBWATCH_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:*}

