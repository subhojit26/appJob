app = "appjob"
primary_region = "ams"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "dashboard"
  SERVER_ADDRESS = "0.0.0.0"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512