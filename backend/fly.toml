app = "appjob"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "dashboard"
  SERVER_ADDRESS = "0.0.0.0"
  # Persist the SQLite DB on a mounted volume so fetched jobs survive deploys/restarts.
  # Without this, Fly's ephemeral filesystem wipes jobwatch.db on every restart (DB → 0 rows),
  # which is why the dashboard showed no companies after each deploy/OOM/auto-stop.
  JOBWATCH_DB = "/data/jobwatch.db"
  # Container-aware heap sizing. Let the JVM use a percentage of the VM RAM so it
  # does not get OOM-killed (which caused the 502 / "No Access-Control-Allow-Origin").
  JAVA_TOOL_OPTIONS = "-XX:+UseContainerSupport -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
  JOBWATCH_DISCOVERY_MAX_PROBES_PER_RUN = "20"

# Persistent storage for the SQLite database (survives restarts & deploys).
# Create the volume once before deploying:
#   fly volumes create jobwatch_data --size 1 --region ams
[mounts]
  source = "jobwatch_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Readiness check so the Fly proxy waits for the app instead of returning 502s
  # (and bad/missing CORS headers) while the JVM is still starting or restarting.
  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "40s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
